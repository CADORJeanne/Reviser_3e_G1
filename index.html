<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Flashcards de révision 3e : les aires urbaines en France (G1).">
<meta name="theme-color" content="#1E3A8A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Révise G1">
<meta name="format-detection" content="telephone=no">
<title>Flashcards G1 Aires urbaines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : une colonne centrée façon « boîte à fiches bristol ». Les cartes sont des fiches lignées, chaque thème a sa couleur d'onglet. */
:root{
  --paper:#E8EBEE; --card:#FFFFFF; --ink:#18202C; --ink-2:#4F5B6B; --line:#CBD3DC;
  --rule:#C9DAEE; --margin:#E6A3A3; --accent:#1E3A8A; --accent-ink:#FFFFFF; --gold:#A86A0C;
  --ok:#15803D; --mid:#B45309; --ko:#B91C1C; --shadow:rgba(24,32,44,.12);
  --c-def:#0F766E; --c-reperes:#A15C07; --c-orga:#B42318; --c-etal:#4D7C0F; --c-metro:#1D4ED8; --c-approf:#7C3AED; --c-methode:#7C3AED;
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10151C; --card:#19212B; --ink:#E7EBF0; --ink-2:#9DA9B8; --line:#2C3746;
  --rule:#22334A; --margin:#5C2E2E; --accent:#9DB7FF; --accent-ink:#0E1626; --gold:#E3B252;
  --ok:#4ADE80; --mid:#FBBF24; --ko:#F87171; --shadow:rgba(0,0,0,.45);
  --c-def:#2DD4BF; --c-reperes:#F0B429; --c-orga:#F87171; --c-etal:#A3E635; --c-metro:#7EA6FF; --c-approf:#B794F6; --c-methode:#B794F6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10151C; --card:#19212B; --ink:#E7EBF0; --ink-2:#9DA9B8; --line:#2C3746;
  --rule:#22334A; --margin:#5C2E2E; --accent:#9DB7FF; --accent-ink:#0E1626; --gold:#E3B252;
  --ok:#4ADE80; --mid:#FBBF24; --ko:#F87171; --shadow:rgba(0,0,0,.45);
  --c-def:#2DD4BF; --c-reperes:#F0B429; --c-orga:#F87171; --c-etal:#A3E635; --c-metro:#7EA6FF; --c-approf:#B794F6; --c-methode:#B794F6;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono)}
.muted{color:var(--ink-2)}

/* ---------- Barre du haut ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.tab-h2{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1;padding:6px 10px 4px;border:2.5px solid var(--ink);border-radius:4px;letter-spacing:.02em}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.05;letter-spacing:.01em;text-transform:uppercase}
.brand-txt span{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase}
.navbtns{display:flex;gap:8px}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.ghost:hover{border-color:var(--ink-2)}

/* ---------- Tableau de bord ---------- */
.dash{background:var(--card);border-radius:14px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px var(--shadow);padding:20px;display:grid;gap:18px}
.player{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lvl{width:66px;height:66px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:900;font-size:32px;line-height:1;position:relative}
.lvl small{position:absolute;bottom:-8px;font-family:var(--f-mono);font-size:10px;background:var(--card);color:var(--ink);border:1.5px solid var(--accent);border-radius:999px;padding:1px 7px;letter-spacing:.06em}
.pinfo{flex:1;min-width:200px}
.pname{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pname h2{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1;text-transform:uppercase;letter-spacing:.01em}
.namefield{display:flex;gap:6px;align-items:center;margin-top:2px}
.namefield input{font:inherit;font-size:16px;padding:5px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:180px;max-width:100%}
.xpbar{height:12px;border-radius:999px;background:var(--paper);overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:999px;transition:width .6s ease}
.xptxt{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);margin-top:4px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-2);line-height:1.25;display:block;margin-top:3px}
.stat.ready b{color:var(--ok)}
.stat.fire b{color:var(--mid)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}

.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 10px;flex-wrap:wrap}
.sec-title h3{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* Thèmes = onglets de boîte à fiches */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.theme{--c:var(--accent);text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 12px 10px;display:grid;gap:6px;position:relative;transition:border-color .15s,transform .15s}
.theme:hover{transform:translateY(-1px)}
.theme[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:var(--card);background:color-mix(in srgb,var(--c) 7%,var(--card))}
.theme .th-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.theme .th-name{font-weight:700;font-size:15.5px;line-height:1.2;color:var(--ink)}
.chk{width:20px;height:20px;border-radius:5px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.theme[aria-pressed="true"] .chk{background:var(--c);border-color:var(--c)}
.theme[aria-pressed="true"] .chk::after{content:"";width:10px;height:5px;border-left:2.5px solid var(--card);border-bottom:2.5px solid var(--card);transform:rotate(-45deg) translate(1px,-1px)}
.th-meta{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.mbar{height:6px;border-radius:999px;background:var(--paper);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--c);border-radius:999px}
.theme .dot{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;margin-right:7px;vertical-align:1px}

/* Modes */
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:700px){.modes{grid-template-columns:1fr}}
.mode{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start}
.mode h4{margin:0;font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.mode p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.4}
.seg{display:flex;gap:4px;background:var(--paper);border-radius:999px;padding:3px;width:max-content;max-width:100%}
.seg button{border:0;background:transparent;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.go{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 14px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,filter .12s}
.go:hover{filter:brightness(1.08)}
.go:active{transform:scale(.98)}
.go.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.go[disabled]{opacity:.45;cursor:not-allowed}
.review-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;padding:12px 14px;border-radius:10px;border:1.5px dashed var(--ko);background:var(--card);background:color-mix(in srgb,var(--ko) 6%,var(--card))}
.review-banner p{margin:0;font-size:14.5px;min-width:0}
.review-banner .go{background:var(--ko);color:var(--card)}

.badge-strip{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- Session ---------- */
.sess-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.prog{flex:1;height:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .35s ease}
.sess-count{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.combo{font-family:var(--f-display);font-weight:900;font-size:19px;color:var(--mid);min-width:64px;text-align:right;letter-spacing:.02em}
.combo.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.35)}}

.stage{perspective:1600px}
.flip{display:grid;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.75,.25,1);cursor:pointer;-webkit-tap-highlight-color:transparent}
.flip.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:14px;box-shadow:0 1px 0 var(--line),0 18px 40px -22px var(--shadow);min-height:340px;display:flex;flex-direction:column;overflow:hidden;--c:var(--accent)}
.face.back{transform:rotateY(180deg)}
/* fiche bristol : lignes bleues + marge rouge */
.ruled{flex:1;display:flex;flex-direction:column;padding:22px 22px 18px 44px;position:relative;
  background-image:linear-gradient(var(--card) 0 0),repeating-linear-gradient(to bottom,transparent 0 27px,var(--rule) 27px 28px);
  background-size:2px 100%,100% 100%;background-repeat:no-repeat;background-position:30px 0,0 6px}
.ruled::before{content:"";position:absolute;left:32px;top:0;bottom:0;width:1.5px;background:var(--margin)}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-bottom:3px solid var(--c);background:var(--card);background:color-mix(in srgb,var(--c) 9%,var(--card))}
.ftag{font-family:var(--f-mono);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.fbox{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);display:flex;gap:3px;align-items:center}
.fbox i{width:8px;height:8px;border-radius:2px;background:var(--line);display:inline-block}
.fbox i.on{background:var(--c)}
.q{font-weight:700;font-size:clamp(21px,3.6vw,28px);line-height:1.3;margin:auto 0;text-wrap:balance;padding-block:18px}
.hint{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);text-align:center;letter-spacing:.04em;margin-top:auto}
.ans-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--c);font-weight:600}
.ans{font-weight:700;font-size:clamp(18px,2.8vw,22px);line-height:1.35;margin:4px 0 10px}
.det{font-size:15.5px;line-height:1.6;margin:0 0 12px;color:var(--ink)}
.det ul{margin:4px 0;padding-left:20px}
.plus{margin-top:auto;border-radius:10px;padding:10px 12px;background:var(--card);background:color-mix(in srgb,var(--c-approf) 8%,var(--card));border:1px solid color-mix(in srgb,var(--c-approf) 30%,var(--card));font-size:14.5px;line-height:1.5}
.plus b.lab{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--c-approf);margin-bottom:2px}
.qback{font-size:13.5px;color:var(--ink-2);margin:0 0 6px;font-style:italic}

.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.rate button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 8px;font-weight:700;font-size:15px;display:grid;gap:2px;justify-items:center;transition:transform .1s}
.rate button small{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--ink-2)}
.rate button:active{transform:scale(.97)}
.rate .r0{border-color:var(--ko);color:var(--ko)}
.rate .r1{border-color:var(--mid);color:var(--mid)}
.rate .r2{border-color:var(--ok);color:var(--ok)}
.rate .r0:hover{background:var(--card);background:color-mix(in srgb,var(--ko) 8%,var(--card))}
.rate .r1:hover{background:var(--card);background:color-mix(in srgb,var(--mid) 8%,var(--card))}
.rate .r2:hover{background:var(--card);background:color-mix(in srgb,var(--ok) 8%,var(--card))}
.reveal{margin-top:14px;width:100%}
.keys{text-align:center;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);margin-top:10px}
@media (hover:none){.keys{display:none}}
.xpfloat{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-family:var(--f-display);font-weight:900;font-size:38px;color:var(--gold);pointer-events:none;animation:xpf .9s ease forwards;z-index:30;text-shadow:0 2px 0 var(--card)}
@keyframes xpf{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-60px)}}

/* QCM */
.qcm-opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15.5px;line-height:1.4;display:flex;gap:12px;align-items:flex-start}
.opt .l{font-family:var(--f-mono);font-weight:600;width:26px;height:26px;flex:none;border-radius:6px;display:grid;place-items:center;background:var(--paper);font-size:13px}
.opt:hover:not([disabled]){border-color:var(--ink-2)}
.opt.good{border-color:var(--ok);background:var(--card);background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.opt.bad{border-color:var(--ko);background:var(--card);background:color-mix(in srgb,var(--ko) 10%,var(--card))}
.opt[disabled]{cursor:default}
.feedback{margin-top:12px;border-radius:12px;padding:12px 14px;background:var(--card);border-left:5px solid var(--ok);font-size:15px}
.feedback.ko{border-left-color:var(--ko)}
.feedback b.v{display:block;font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.timer{height:4px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:-2px}
.timer i{display:block;height:100%;background:var(--gold);width:100%}

/* Frise */
.frise-pool{display:grid;gap:10px;margin-top:14px}
.ev{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:15.5px;line-height:1.35;--c:var(--accent)}
.ev .n{width:32px;height:32px;flex:none;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:19px}
.ev.picked{border-color:var(--accent)}
.ev.picked .n{border:0;background:var(--accent);color:var(--accent-ink)}
.ev .tg{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);display:block}
.ev .yr{margin-left:auto;font-family:var(--f-mono);font-weight:600;font-size:13px;white-space:nowrap}
.ev.right{border-color:var(--ok)}
.ev.wrong{border-color:var(--ko)}
.ev.right .n{background:var(--ok);color:var(--card)}
.ev.wrong .n{background:var(--ko);color:var(--card)}
.timeline{position:relative;margin-top:16px;padding-left:22px;display:grid;gap:10px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:3px;background:var(--line);border-radius:2px}
.tl{position:relative;font-size:15px}
.tl::before{content:"";position:absolute;left:-20px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--c,var(--accent));border:2px solid var(--card)}
.tl b{font-family:var(--f-mono);font-size:13px;margin-right:8px}

/* Fin de session */
.endcard{background:var(--card);border-radius:14px;padding:22px;box-shadow:0 1px 0 var(--line),0 18px 40px -22px var(--shadow);display:grid;gap:16px}
.endcard h2{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,6vw,44px);text-transform:uppercase;line-height:1}
.endstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.endstats{grid-template-columns:repeat(2,1fr)}}
.endstats .stat b.k{color:var(--ko)} .endstats .stat b.m{color:var(--mid)} .endstats .stat b.o{color:var(--ok)} .endstats .stat b.x{color:var(--gold)}
.miss{display:grid;gap:8px}
.miss details{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;--c:var(--accent)}
.miss summary{cursor:pointer;font-weight:700;font-size:15px;list-style-position:outside}
.miss summary .ftag{margin-right:8px}
.miss details p{margin:8px 0 0;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .go{flex:1;min-width:180px}

/* Badges */
.medal{width:92px;display:grid;justify-items:center;gap:6px;text-align:center}
.medal .disc{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--gold) 55%,var(--card)),var(--gold));color:var(--card);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 0 0 3px var(--card),0 0 0 5px var(--gold)}
.medal .disc svg{width:30px;height:30px}
.medal span{font-size:12px;font-weight:700;line-height:1.2}
.medal.locked .disc{background:var(--paper);color:var(--ink-2);box-shadow:inset 0 0 0 2px var(--line);opacity:.8}
.medal.locked span{color:var(--ink-2);font-weight:400}
.badges-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.bitem{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px}
.bitem .medal{width:auto}
.bitem .medal .disc{width:52px;height:52px}
.bitem .medal .disc svg{width:24px;height:24px}
.bitem b{display:block;font-size:15px}
.bitem p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.35}
.bitem.locked b{color:var(--ink-2)}
.bilan{background:var(--card);border-radius:14px;padding:20px;border:2px solid var(--ink);display:grid;gap:12px;position:relative;overflow:hidden}
.bilan .stamp{position:absolute;right:14px;top:14px;transform:rotate(8deg);border:3px solid var(--ok);color:var(--ok);font-family:var(--f-display);font-weight:900;font-size:18px;text-transform:uppercase;padding:2px 10px;border-radius:6px;letter-spacing:.04em}
.bilan h2{font-family:var(--f-display);font-weight:900;font-size:28px;text-transform:uppercase;padding-right:120px}

/* ---------- Mise à jour d'une carte ---------- */
function grade(id, r){ // r : 0 raté, 1 presque, 2 su
  const rec = S.cards[id] || (S.cards[id] = {b:0, ok:0, ko:0});
  const before = rec.b;
  if (r === 2) {
    if (rec.f) { S.comeback++; rec.f = false; }
    // carte ratée : elle revient à J+1, puis J+3, puis J+7 tant qu'elle est réussie
    if (rec.st && rec.st < 3) { const d = new Date(); d.setDate(d.getDate() + (rec.st === 1 ? 3 : 7)); rec.due = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); rec.st++; }
    else { delete rec.due; rec.st = 0; }
    rec.b = Math.min(5, Math.max(before, 1) + 1); rec.ok++;
  } else if (r === 1) {
    rec.b = before >= 3 ? before - 1 : Math.max(1, before === 0 ? 1 : before);
    if (before === 0) rec.b = 1;
    rec.due = tomorrow();
  } else {
    rec.b = 1; rec.ko++; rec.f = true; rec.due = tomorrow(); rec.st = 1;
  }
  rec.last = Date.now();
  S.reviewed++; markDay();
}

function pool(){ return CARDS.filter(c => S.sel.includes(c.t)); }
function pick(list, n){
  const now = Date.now();
  return list.map(c => {
    const r = S.cards[c.id]; const b = r ? r.b : 0;
    let pr = b === 0 ? 1.3 : b === 1 ? 0 : b; // les cartes ratées passent en premier, puis les nouvelles
    if (r && r.last && now - r.last < 8 * 60 * 1000) pr += 1.5;
    return {c, pr: pr + Math.random() * 1.2};
  }).sort((a, b) => a.pr - b.pr).slice(0, n).map(x => x.c);
}

let view = "home", F = null;
function startFlip(ids){

function boxDots(id, color){

}
function renderFlip(){

function doFlip(){
  if (view !== "flip") return;
  F.flipped = !F.flipped;
  $("#flip").classList.toggle("flipped", F.flipped);
  if (F.flipped && !$("#rate")) {
    $("#actions").innerHTML = `<div class="rate" id="rate">
      <button class="r0" data-r="0">Raté<small>reviendra vite</small></button>
      <button class="r1" data-r="1">Presque<small>reviendra</small></button>
      <button class="r2" data-r="2">Je savais<small>+10 XP</small></button></div>`;
    app.querySelectorAll("[data-r]").forEach(b => b.onclick = e => { e.stopPropagation(); rateFlip(+b.dataset.r); });
  }
}
function rateFlip(r){
  const id = F.queue[F.i];
  grade(id, r);
  if (!(id in F.res)) F.res[id] = r;
  let gain;
  if (r === 2) { F.combo++; S.bestStreak = Math.max(S.bestStreak, F.combo); gain = 10 + Math.min(F.combo - 1, 5) * 2; }
  else { F.combo = 0; gain = r === 1 ? 4 : 1; }
  addXP(gain);
  // les cartes ratées reviennent dans la même session
  const n = F.requeue[id] || 0;
  if (r === 0 && n < 3) { F.queue.splice(Math.min(F.queue.length, F.i + 4), 0, id); F.requeue[id] = n + 1; }
  else if (r === 1 && n < 1) { F.queue.splice(Math.min(F.queue.length, F.i + 7), 0, id); F.requeue[id] = n + 1; }
  if (!F.queue.slice(F.i + 1).includes(id)) F.done++;
  F.i++;
  save(); checkBadges();
  renderFlip();
  if (F.combo >= 2) { const el = $("#combo"); if (el) el.classList.add("pop"); }
}

let Q = null, timerRAF = 0;
function qcmPool(){ return pool().filter(c => c.s && c.x && c.x.length >= 3); }
function stopTimer(){ cancelAnimationFrame(timerRAF); }
function startQcm(){
  const list = pick(qcmPool(), 10);
  Q = {list, i: 0, score: 0, xp0: S.xp, wrong: [], res: {}, t0: Date.now()};
  view = "qcm"; renderQcm();
}
function optionsFor(c){
  if (c.x) return shuffle([{id: c.id, s: c.s}].concat(c.x.slice(0, 3).map((s, i) => ({id: "_x" + i, s}))));
  const same = CARDS.filter(x => x.g === c.g && x.s && x.s !== c.s && x.id !== c.id);
  const uniq = []; shuffle(same).forEach(x => { if (!uniq.some(u => u.s === x.s)) uniq.push(x); });
  return shuffle([c].concat(uniq.slice(0, 3)));
}
function qcmQuestion(c){
  if (c.g === "def") return "Quelle est la bonne définition de " + c.q.replace(/^Définissez\s*:\s*/, "") + " ?";
  return c.q;
}
function renderQcm(){

  app.innerHTML = `

    <div class="ruled" style="padding-block:14px"><div class="q" style="padding-block:6px;font-size:clamp(19px,3vw,24px)">${qcmQuestion(c)}</div></div>
  </div>
  <div class="qcm-opts">${opts.map((o, i) => `<button class="opt" data-id="${o.id}"><span class="l">${"ABCD"[i]}</span><span>${esc(o.s)}</span></button>`).join("")}</div>
  <div id="fb"></div>`;
  $("#quit").onclick = () => { stopTimer(); save(); home(); };
  const t0 = performance.now(), LIM = 10000;
  stopTimer();
  (function tk(){ const e = performance.now() - t0, bar = $("#tbar"); if (!bar) return; bar.style.width = Math.max(0, 100 - e / LIM * 100) + "%"; if (e < LIM) timerRAF = requestAnimationFrame(tk); })();
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {

      <div><b>${c.a}</b></div>${c.d ? `<div style="margin-top:4px">${c.d}</div>` : ""}</div>

let E = null, examTick = 0;
// Transforme une carte de l'appli ou une question essentielle en question d'évaluation
function examItem(src){
  if (typeof src === "string" || src.card) {
    const c = byId[typeof src === "string" ? src : src.card];
    return {t: c.t, cid: c.id, q: qcmQuestion(c), ok: c.s, opts: optionsFor(c).map(o => o.s), expl: c.a + (c.d ? "<br>" + c.d : "")};
  }
  const c = src.c && byId[src.c];
  return {t: src.t, cid: c ? c.id : null, q: src.q, ok: src.ok, opts: shuffle([src.ok].concat(src.x)), expl: c ? c.a + (c.d ? "<br>" + c.d : "") : ""};
}
function startExam(){
  const list = [];
  Object.entries(EXAM_PLAN).forEach(([k, n]) => {
    shuffle(ESSENTIELS[k].filter(x => typeof x !== "string" || byId[x]).filter(x => !(x && x.card) || byId[x.card])).slice(0, n).forEach(x => list.push(examItem(x)));

  app.innerHTML = `${head(V.i, V.items.length, `${V.i + 1}/${V.items.length}`, V.combo >= 2 ? "×" + V.combo : "")}
  ${intro("var(--c-orga)", "Vrai ou faux", "attention aux pièges", "« " + esc(it.s) + " »")}
  <div class="rate two"><button class="r2" data-v="1">Vrai<small>c'est juste</small></button><button class="r0" data-v="0">Faux<small>il y a une erreur</small></button></div>
  <div id="fb"></div>`;
  bindQuit();
  app.querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
    const v = b.dataset.v === "1", good = v === it.v;
    app.querySelectorAll("[data-v]").forEach(x => { x.disabled = true; if (x === b) x.classList.add("picked"); });
    if (good) { V.score++; V.combo++; S.bestStreak = Math.max(S.bestStreak, V.combo); addXP(8 + Math.min(V.combo - 1, 5)); }
    else { V.combo = 0; V.wrong.push(it); }
    markDay(); save(); checkBadges();
    $("#fb").innerHTML = `<div class="feedback ${good ? "" : "ko"} fade-in"><b class="v" style="color:${good ? "var(--ok)" : "var(--ko)"}">${good ? "Bien vu !" : "Raté !"} C'est ${it.v ? "vrai" : "faux"}.</b><div>${it.e}</div></div>
      <button class="go" id="next" style="width:100%;margin-top:12px">${V.i + 1 < V.items.length ? "Affirmation suivante" : "Voir mon score"} ${ico("arrow",18)}</button>`;
    $("#next").onclick = () => { V.i++; renderVf(); };
    $("#next").focus({preventScroll:true});
  });
}
function endVf(){
  view = "end"; track("session-vrai-faux"); report("Vrai ou faux", V.score, V.items.length, {vf: V.score});
  const perfect = V.score === V.items.length;
  if (perfect) { addXP(20); confetti(); }
  save(); checkBadges();
  endCard({tag:"Vrai ou faux terminé", title:`${V.score}/${V.items.length}${perfect ? " · Aucun piège !" : ""}`, ok:V.score, ko:V.wrong.length, xp:S.xp - V.xp0,
    miss: V.wrong.length ? `<div class="miss">${V.wrong.map(it => `<details style="--c:var(--c-orga)" open><summary><span class="ftag">${it.v ? "Vrai" : "Faux"}</span>${esc(it.s)}</summary><p>${it.e}</p></details>`).join("")}</div>` : "",
    again:"Nouvelle série", retry:startVf});
}

/* =========================================================
   SCHÉMA À COMPLÉTER
   ========================================================= */
let SC = null;
function startSchema(){ SC = {placed: {}, sel: null, checked: false, order: shuffle(LABELS.map(l => l.l)), xp0: S.xp}; view = "schema"; renderSchema(); }
function renderSchema(){
  const P = SC.placed, used = Object.values(P), score = SLOTS.filter(s => P[s.s] === s.ans).length, perfect = score === SLOTS.length;
  const name = l => esc(LABELS.find(x => x.l === l).n);
  const lbl = l => `<button class="lbl${SC.sel === l ? " sel" : ""}" data-l="${l}">${name(l)}</button>`;
  const row = s => {
    const st = SC.checked ? (P[s.s] === s.ans ? " good" : " bad") : "";
    return `<div class="lrow">${s.fig ? `<span class="fig">${s.fig}</span>` : `<span class="eqt">${s.eq}</span>`}<div class="slot${st}" data-s="${s.s}">${P[s.s] ? lbl(P[s.s]) : ""}</div></div>
      ${SC.checked && st === " bad" ? `<div class="corr${s.eq ? " eqc" : ""}">→ ${name(s.ans)}</div>` : ""}`;
  };
  const grp = g => SLOTS.filter(s => s.g === g).map(row).join("");
  app.innerHTML = `${head(used.length, SLOTS.length, `${used.length}/${SLOTS.length}`, "")}
  ${intro("var(--c-etal)", "Schéma à compléter", "9 étiquettes à placer",
    SC.checked ? (perfect ? "Schéma parfait !" : `${score}/${SLOTS.length} bien placées : les erreurs sont en rouge.`) : "Glissez chaque étiquette dans la bonne case de la légende. Vous pouvez aussi toucher une étiquette, puis une case.", SC.drawn && !SC.checked)}
  <div class="sch${SC.sel ? " target" : ""}">
    <div class="sch-draw"><span class="ftag">Schéma d'une aire urbaine</span>${SCHEMA_SVG}</div>
    <div>
      <div class="face" style="--c:var(--c-etal);min-height:0"><div class="fhead"><span class="ftag">Légende</span></div>
        <div class="leg"><h5>I. Les espaces</h5>${grp(1)}<h5>II. Les mobilités et les évolutions</h5>${grp(2)}<h5>III. Les ensembles</h5>${grp(3)}</div></div>
      ${SC.checked ? "" : `<div class="bank" id="bank">${SC.order.filter(l => !used.includes(l)).map(lbl).join("")}</div>`}
    </div>
  </div>
  ${SC.checked ? `<div class="feedback ${perfect ? "" : "ko"} fade-in"><b class="v" style="color:${perfect ? "var(--ok)" : "var(--ko)"}">${score}/${SLOTS.length} · Correction</b><ul>${SLOTS.map(s => `<li>${s.e}</li>`).join("")}</ul></div>
    <div class="row" style="margin-top:14px"><button class="go" id="again">${ico("loop",18)} Refaire le schéma</button><button class="go alt" id="back">Accueil</button></div>`
  : `<div class="row" style="margin-top:14px"><button class="go" id="check" ${used.length < SLOTS.length ? "disabled" : ""}>Vérifier mon schéma ${ico("arrow",18)}</button></div>`}`;
  SC.drawn = true;
  bindQuit();
  if (SC.checked) { $("#again").onclick = startSchema; $("#back").onclick = home; return; }
  $("#check").onclick = () => {
    SC.checked = true; track("session-schema"); report("Schéma", score, SLOTS.length, {schema: score});
    let gain = score * 4;
    if (perfect) { gain += 20; S.schemaPerfect = (S.schemaPerfect || 0) + 1; confetti(); }
    addXP(gain); markDay(); save(); checkBadges(); renderSchema(); window.scrollTo(0, 0);
  };
  bindDrag();
}
function placeLbl(l, s){ const P = SC.placed; for (const k in P) if (P[k] === l) delete P[k]; P[s] = l; SC.sel = null; keepScroll(renderSchema); }
function unplaceLbl(l){ const P = SC.placed; for (const k in P) if (P[k] === l) delete P[k]; SC.sel = null; keepScroll(renderSchema); }
function tapLbl(l){ if (Object.values(SC.placed).includes(l)) { unplaceLbl(l); return; } SC.sel = SC.sel === l ? null : l; keepScroll(renderSchema); }
function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0, y); }
function bindDrag(){
  const under = (x, y, sel) => { const el = document.elementFromPoint(x, y); return el && el.closest(sel); };
  app.querySelectorAll(".lbl[data-l]").forEach(ch => {
    ch.addEventListener("click", e => { if (e.detail === 0) tapLbl(ch.dataset.l); });
    ch.addEventListener("pointerdown", e => {
      if (e.button > 0) return; e.preventDefault();
      const sx = e.clientX, sy = e.clientY; let gh = null, moved = false;
      const mv = ev => {
        if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 7) {
          moved = true; gh = ch.cloneNode(true); gh.classList.add("dragghost"); gh.classList.remove("sel");
          gh.style.width = ch.offsetWidth + "px"; document.body.appendChild(gh); ch.classList.add("dragging");
        }
        if (moved) { if (ev.clientY < 70) scrollBy(0, -14); else if (ev.clientY > innerHeight - 70) scrollBy(0, 14);
          gh.style.left = ev.clientX + "px"; gh.style.top = ev.clientY + "px"; const t = under(ev.clientX, ev.clientY, ".slot"); app.querySelectorAll(".slot").forEach(s => s.classList.toggle("hover", s === t)); }
      };
      const up = ev => {
        removeEventListener("pointermove", mv); removeEventListener("pointerup", up); removeEventListener("pointercancel", up);
        if (moved) {
          gh.remove(); ch.classList.remove("dragging");
          const t = under(ev.clientX, ev.clientY, ".slot");
          if (t) placeLbl(ch.dataset.l, t.dataset.s); else if (under(ev.clientX, ev.clientY, "#bank")) unplaceLbl(ch.dataset.l); else keepScroll(renderSchema);
        } else if (ev.type === "pointerup") tapLbl(ch.dataset.l);
      };
      addEventListener("pointermove", mv); addEventListener("pointerup", up); addEventListener("pointercancel", up);
    });
  });
  app.querySelectorAll(".slot").forEach(s => s.addEventListener("click", e => { if (e.target.closest(".lbl")) return; if (SC.sel) placeLbl(SC.sel, s.dataset.s); }));
}

/* =========================================================
   CONSTRUIRE UN PLAN
   ========================================================= */
let PL = null;
function planPick(){
  view = "planpick";
  app.innerHTML = `<div class="sess-head"><button class="ghost" id="quit" aria-label="Retour à l'accueil">${ico("back",16)}</button></div>
  ${intro("var(--c-methode)", "Construire un plan", "développement construit", "Choisissez un sujet. Rangez chaque idée dans la bonne partie et repérez l'idée hors sujet (✕).")}
  <div class="subj">${PLANS.map((p, i) => `<button class="ev" data-p="${i}" style="--c:var(--c-methode)"><span class="n">${i + 1}</span><span><span class="tg">Sujet possible</span>${esc(p.s)}</span></button>`).join("")}</div>`;
  bindQuit();
  app.querySelectorAll("[data-p]").forEach(b => b.onclick = () => startPlan(+b.dataset.p));
  window.scrollTo(0, 0);
}
function startPlan(i){ PL = {p: i, as: {}, checked: false, order: shuffle(PLANS[i].ideas.map((_, k) => k)), xp0: S.xp}; view = "plan"; renderPlan(); window.scrollTo(0, 0); }
function renderPlan(){
  const P = PLANS[PL.p], as = PL.as, n = Object.keys(as).length, tot = P.ideas.length;
  const ok = k => as[k] === P.ideas[k].p, score = P.ideas.filter((_, k) => ok(k)).length, perfect = score === tot;
  app.innerHTML = `${head(n, tot, `${n}/${tot}`, "")}
  <div class="face${PL.drawn ? "" : " fade-in"}" style="--c:var(--c-methode);min-height:0"><div class="fhead"><span class="ftag">Sujet possible</span><span class="fbox">${tot} idées à ranger</span></div>
    <div class="ruled" style="padding-block:14px"><div class="q" style="padding-block:4px;font-size:clamp(18px,2.8vw,22px)">« ${esc(P.s)} »</div>
    <div class="skel">${P.parts.map((t, i) => `<div><b>${ROMAN[i]}.</b>${esc(t)}</div>`).join("")}<div class="muted"><b>✕</b>Hors sujet</div></div></div></div>
  ${PL.order.map(k => { const id = P.ideas[k], st = PL.checked ? (ok(k) ? " right" : " wrong") : "";
    return `<div class="idea${st}"><p>${esc(id.t)}${PL.checked && !ok(k) ? `<span class="why">→ ${id.p < 0 ? "Hors sujet : " + esc(id.w) : "Partie " + ROMAN[id.p] + " : " + esc(P.parts[id.p])}</span>` : ""}</p>
      <div class="seg" role="group" aria-label="Partie">${[...P.parts.map((_, i) => i), -1].map(v => `<button data-k="${k}" data-v="${v}" aria-pressed="${as[k] === v}" ${PL.checked ? "disabled" : ""}>${v < 0 ? "✕" : ROMAN[v]}</button>`).join("")}</div></div>`; }).join("")}
  ${PL.checked ? `<div class="feedback ${perfect ? "" : "ko"} fade-in"><b class="v" style="color:${perfect ? "var(--ok)" : "var(--ko)"}">${score}/${tot} idées bien placées</b><div style="margin-bottom:8px">Voici le plan modèle, à savoir refaire le jour de l'évaluation :</div>${planHtml(P)}</div>
    <div class="row" style="margin-top:14px"><button class="go" id="other">Autre sujet ${ico("arrow",18)}</button><button class="go alt" id="back">Accueil</button></div>`
  : `<div class="row" style="margin-top:14px"><button class="go" id="check" ${n < tot ? "disabled" : ""}>Vérifier mon plan ${ico("arrow",18)}</button></div>`}`;
  PL.drawn = true;
  bindQuit();
  if (PL.checked) { $("#other").onclick = planPick; $("#back").onclick = home; return; }
  app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { PL.as[+b.dataset.k] = +b.dataset.v; keepScroll(renderPlan); });
  $("#check").onclick = () => {
    PL.checked = true; track("session-plan"); report("Plan", score, tot, {plan: score});
    let gain = score * 3; if (perfect) { gain += 15; confetti(); }
    addXP(gain); markDay(); save(); checkBadges(); keepScroll(renderPlan);
  };
}

/* =========================================================
   RELIRE TOUTES LES CARTES
   ========================================================= */
function listView(){
  view = "list";
  app.innerHTML = `<div class="sess-head"><button class="ghost" id="quit">${ico("back",16)} Bilan</button></div>
  <div class="sec-title" style="margin-top:0"><h3>Toutes les cartes</h3><span class="muted" style="font-size:14px">${CARDS.length} cartes · ${VF.length} vrai ou faux</span></div>
  ${Object.entries(THEMES).map(([k, t]) => `<div class="sec-title"><h3 style="color:${t.color};font-size:19px">${esc(t.label)}</h3></div>
    <div class="miss">${inTheme(k).map(c => `<details style="--c:${t.color}"><summary><span class="ftag">${c.aj ? "Ajout" : esc(t.short)}</span>${strip(c.q)}</summary><p><b>${c.a}</b></p>${c.d ? `<div style="margin-top:6px">${c.d}</div>` : ""}${c.p ? `<div style="margin-top:6px" class="muted">${c.p}</div>` : ""}</details>`).join("")}</div>`).join("")}`;
  $("#quit").onclick = badgesView;
  window.scrollTo(0, 0);
}

/* =========================================================
   BADGES ET BILAN
   ========================================================= */
function badgesView(){
  view = "badges"; confirmReset = false; renderBadges();
}
function renderBadges(){
  const lv = level(), g = mastery(CARDS);
  app.innerHTML = `
  <div class="sess-head"><button class="ghost" id="quit">${ico("back",16)} Accueil</button></div>
  <section class="bilan fade-in">
    ${g >= .7 ? `<span class="stamp">Prêt !</span>` : ""}
    <span class="ftag" style="color:var(--accent)">Bilan de révision · G1</span>
    <h2>Mon bilan</h2>
    <div class="muted" style="font-size:14.5px">Niveau ${lv.n}/${LEVELS.length} · ${esc(lv.name)} · ${S.xp} XP · ${S.reviewed} cartes révisées · ${Object.keys(S.badges).length}/${BADGES.length} badges</div>
    <div class="tbars">
      ${Object.entries(THEMES).map(([k, t]) => { const m = mastery(inTheme(k)); return `<div class="tbar" style="--c:${t.color}"><span>${esc(t.label)}</span><div class="mbar"><i style="width:${pct(m)}%"></i></div><b>${pct(m)}%</b></div>`; }).join("")}
      <div class="tbar" style="--c:var(--ok);font-weight:700"><span>Total</span><div class="mbar"><i style="width:${pct(g)}%"></i></div><b>${pct(g)}%</b></div>
    </div>
  </section>
  <div class="sec-title"><h3>Badges</h3><span class="muted" style="font-size:14px">${Object.keys(S.badges).length} sur ${BADGES.length}</span></div>
  <div class="badges-grid">
    ${BADGES.map(b => { const has = !!S.badges[b.id]; return `<div class="bitem${has ? "" : " locked"}">${medal(b, !has)}<div><b>${esc(b.name)}</b><p>${esc(b.desc)}</p></div></div>`; }).join("")}
  </div>
  <div class="sec-title"><h3>Relire toutes les cartes</h3><button class="linkbtn" id="toList">Ouvrir la liste</button></div>
  <div class="sec-title"><h3>Recommencer à zéro</h3></div>
  <div class="confirm-box" id="resetZone">
    ${confirmReset ? `<span>Tout effacer (XP, badges, progression) ?</span><button class="danger" id="yes">Oui, tout effacer</button><button class="ghost" id="no">Annuler</button>`
      : `<button class="danger" id="reset">Effacer ma progression</button>`}
  </div>`;
  $("#quit").onclick = home;
  $("#toList").onclick = listView;
  if (confirmReset) { $("#yes").onclick = () => { S = fresh(); save(); home(); }; $("#no").onclick = () => { confirmReset = false; renderBadges(); }; }
  else $("#reset").onclick = () => { confirmReset = true; renderBadges(); };
  window.scrollTo(0, 0);
}

home();
